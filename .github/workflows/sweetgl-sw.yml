name: sweetgl-sw

# wp210: sweetgl.dylib with Mesa softpipe (CPU rendering) for iOS 16 arm64.
on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa commit (github.com/mirror/mesa); the default is the one the softpipe port was checked against
        default: e24dc5bd1e7fe6101bdc866fb16a15a8fcae1aae
  push:
    branches: [main]
    paths:
      - "tools/sweetgl/**"
      - ".github/workflows/sweetgl-sw.yml"

concurrency:
  group: sweetgl-sw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install ninja bison flex
          python3 -m pip install --break-system-packages meson mako pyyaml packaging
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          xcrun -sdk iphoneos --show-sdk-path

      - name: Fetch Mesa
        run: |
          git init -q mesa
          git -C mesa fetch -q --depth 1 https://github.com/mirror/mesa.git "${{ inputs.mesa_ref || 'e24dc5bd1e7fe6101bdc866fb16a15a8fcae1aae' }}"
          git -C mesa checkout -q FETCH_HEAD
          cat mesa/VERSION

      - name: Build
        run: MESA_SRC=$PWD/mesa MESA_BUILD=$PWD/mesa-ios-sw bash tools/sweetgl/build-sw.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweetgl-sw
          path: tools/sweetgl/out-sw/sweetgl.dylib
          if-no-files-found: warn
