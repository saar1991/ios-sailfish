name: ksym
# Prints a built kernel's text symbols into the log ("SYM addr name"),
# so profiler PCs can be resolved without downloading the artifact.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: xnu workflow run whose xnu-kernel artifact to read
        required: true
jobs:
  sym:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: k
      - name: symbols
        run: |
          find k -type f | head -20
          K=$(find k -name 'kernel.development*' -type f ! -path '*dSYM*' | head -1)
          echo "kernel $K"; shasum -a 256 "$K"
          xcrun nm -n "$K" | awk '$2 ~ /^[tT]$/ {print "SYM", $1, $3}'
